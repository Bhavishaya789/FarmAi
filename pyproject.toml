[project]
name = "farmai"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.6",
    "python-multipart>=0.0.12",
    "pymongo>=4.8.0",
    "passlib[bcrypt]>=1.7.4",
    "python-jose[cryptography]>=3.3.0",
    "bcrypt>=4.0.1",
    "numpy>=1.26.4",
    "pandas>=2.2.2",
    "scikit-learn>=1.5.0",
    "joblib>=1.4.2",
    "Pillow>=10.4.0",
    "opencv-python-headless>=4.10.0.84",
    "pypdf>=4.3.1",
    "python-dotenv>=1.0.1",
    "requests>=2.32.3",
    "gTTS>=2.5.1"
]

[tool.vercel]
entrypoint = "crop:app"
